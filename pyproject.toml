[project]
name = "datamate"
version = "0.1.0"
description = "Baseline Table-QA agent (smolagents + Qwen3.5-9B) for the DataMate challenge"
requires-python = ">=3.11"
dependencies = [
    "smolagents[openai]>=1.20",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.scripts]
datamate = "datamate.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datamate"]
